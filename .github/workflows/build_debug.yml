name: Build Debug APK

on:
  push:
    branches: [ "beta" ]
    paths:
      - 'app/**'
      - 'ModuleBase/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize-with-crowdin:
    name: Upload strings to Crowdin
    if: github.repository_owner == 'Mahmud0808'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Strings
        uses: crowdin/github-action@v2
        with:
          upload_translations: false
          upload_sources: true
          download_translations: false
          localization_branch_name: beta-localization
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Increase Gradle heap
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get application version name
        run: echo "VERSION_NAME=$(${{ github.workspace }}/gradlew -q printVersionName)" >> $GITHUB_ENV

      - name: Bump application version code
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: "${{ env.VERSION_NAME }} Dev (#${{ github.run_number }})"

      - name: Write sign info
        if: github.repository == 'Mahmud0808/Iconify'
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug

      - name: Build FOSS Debug APKs
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleFossDebug -PsplitApks

      - name: Upload Standard Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify Standard v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }})"
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload FOSS Build Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify (FOSS) v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}) - arm64-v8a"
          path: app/build/outputs/apk/foss/debug/*-arm64-v8a-*.apk
          if-no-files-found: error

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify (FOSS) v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}) - armeabi-v7a"
          path: app/build/outputs/apk/foss/debug/*-armeabi-v7a-*.apk
          if-no-files-found: error

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify (FOSS) v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}) - x86"
          path: app/build/outputs/apk/foss/debug/*-x86-*.apk
          if-no-files-found: error

      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: "Iconify (FOSS) v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}) - x86_64"
          path: app/build/outputs/apk/foss/debug/*-x86_64-*.apk
          if-no-files-found: error

      - name: Restore last notified commit
        uses: actions/cache/restore@v4
        with:
          path: .ci/last_notified_sha
          key: telegram-last-sha-${{ github.run_id }}
          restore-keys: telegram-last-sha-

      - name: Get Commit Messages
        id: get_commit_message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "SKIP_BUILD=false" >> $GITHUB_ENV

          LAST_SHA=$(cat .ci/last_notified_sha 2>/dev/null || true)

          HEADERS=""
          if [[ -n "$LAST_SHA" && "$LAST_SHA" != "${{ github.sha }}" ]]; then
            HEADERS=$(gh api "repos/${{ github.repository }}/compare/$LAST_SHA...${{ github.sha }}" \
              --jq '.commits[].commit.message | split("\n")[0]' || true)
          fi
          if [[ -z "$HEADERS" ]]; then
            HEADERS=$(git log -1 --pretty=%B | head -n 1)
          fi

          HEADERS=$(echo "$HEADERS" \
            | sed -E 's/^Merge remote-tracking branch.*/Synced with the latest changes/' \
            | sed -E 's|.*Mahmud0808/beta-localization$|Updated translations|' \
            | sed '/^[[:space:]]*$/d' \
            | awk '!seen[$0]++')

          if [[ -z "$HEADERS" ]]; then
            echo "No valid changelog found!"
            HEADERS="No valid changelog found!"
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          fi

          if [[ $(echo "$HEADERS" | wc -l) -gt 1 ]]; then
            CHANGELOG=$(printf '\n%s' "$(echo "$HEADERS" | sed 's/^/• /')")
          else
            CHANGELOG=" $HEADERS"
          fi
          CHANGELOG=$(printf '%s' "$CHANGELOG" | head -c 900)

          ESCAPED_MESSAGE=$(printf '%s' "$CHANGELOG" | jq -Rsa . | sed 's/^"\(.*\)"$/\1/' | sed "s/'//g")
          echo "COMMIT_MESSAGE_HEADER=${ESCAPED_MESSAGE}" >> $GITHUB_ENV

      - name: Clean Previous Release Folder
        run: rm -rf releases && mkdir -p releases

      - name: Zip APK + ModuleBase contents
        if: env.SKIP_BUILD != 'true'
        run: |
          set -e

          ZIP_NAME="Iconify A16 v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}).zip"
          RELEASE_DIR="releases"
          APK_DIR="app/build/outputs/apk/standard/debug"

          mkdir -p "$RELEASE_DIR/temp"

          cp "$APK_DIR"/*.apk "$RELEASE_DIR/temp/Iconify.apk"
          cp -r ModuleBase/* "$RELEASE_DIR/temp/"

          cd "$RELEASE_DIR/temp"
          zip -r "../$ZIP_NAME" .

          cd ../..
          rm -rf "$RELEASE_DIR/temp"

      - name: Telegram File Attachment
        if: github.repository == 'Mahmud0808/Iconify' && env.SKIP_BUILD != 'true'
        run: |
          set -e
          curl -v "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMediaGroup" \
            -F chat_id=${{ secrets.TG_CHAT_ID }} \
            -F message_thread_id=${{ secrets.TG_CHAT_THREAD_ID }} \
            -F media='[
              {"type":"document","media":"attach://file","caption":"#Iconify:${{ env.COMMIT_MESSAGE_HEADER }}"}
            ]' \
            -F file="@releases/Iconify A16 v${{ env.VERSION_NAME }} Dev (#${{ github.run_number }}).zip" \
            -F disable_notification=true || exit 1

      - name: Remember notified commit
        if: github.repository == 'Mahmud0808/Iconify' && env.SKIP_BUILD != 'true'
        run: |
          mkdir -p .ci
          echo "${{ github.sha }}" > .ci/last_notified_sha

      - name: Save last notified commit
        if: github.repository == 'Mahmud0808/Iconify' && env.SKIP_BUILD != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/last_notified_sha
          key: telegram-last-sha-${{ github.run_id }}
